  pixi_ubuntu_tests:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: install pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          manifest-path: .github/workflows/pixi/pixi.toml
          pixi-version: v0.66.0
          cache: false
      - name: run tests
        shell: bash
        run: |
          pixi add  --manifest-path .github/workflows/pixi/pixi.toml rattler-build compilers sphinx  tango-database tango-starter tango-admin nxsconfigserver-db mysql-server
          mkdir ./mysql_data
          pixi run --manifest-path .github/workflows/pixi/pixi.toml mysql_install_db  --datadir=./.mysql_data
          pixi run --manifest-path .github/workflows/pixi/pixi.toml mysqld --datadir=./.mysql_data --port=3306 --bind-address=127.0.0.1
          pixi run --manifest-path .github/workflows/pixi/pixi.toml mysqldb -u root -P 3306 < .pixi/envs/default/share/tango/db/create_db.sql
          export MYSQL_HOST="127.0.0.1"
          export MYSQL_USER="root"
          export MYSQL_PASSWORD=""
          export TANGO_HOST="127.0.0.1:10000"
          pixi run --manifest-path .github/workflows/pixi/pixi.toml DataBaseds 2 &
          pixi run --manifest-path .github/workflows/pixi/pixi.toml tango-admin --ping-db
          pixi run --manifest-path .github/workflows/pixi/pixi.toml tango-admin --add-server Starter/my-computer Starter tango/admin/my-computer
          pixi run --manifest-path .github/workflows/pixi/pixi.toml run Starter my-computer &
          pixi run --manifest-path .github/workflows/pixi/pixi.toml tango-admin --ping-device tango/admin/my-computer
          pixi run --manifest-path .github/workflows/pixi/pixi.toml create_nxsconfig_db -x -d=nxsonfig -u=tango -p=".pixi/envs/default"
          pixi run --manifest-path .github/workflows/pixi/pixi.toml rattler-build build  --recipe .github/workflows/pixi/recipe.yaml
          pkill Starter
          pkill Databaseds
          kill $(cat ./mysqldb.pid)
